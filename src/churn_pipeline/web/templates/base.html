<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Churn Pipeline{% endblock %} · Harbor &amp; Vale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><div class="wrap">
  <span class="brand">Harbor &amp; Vale · Churn Pipeline</span>
  <nav>{% for endpoint, label in nav %}<a href="{{ url_for(endpoint) }}" class="{{ 'active' if request.endpoint == endpoint else '' }}">{{ label }}</a>{% endfor %}</nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
