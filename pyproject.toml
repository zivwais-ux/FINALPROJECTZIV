[project]
name = "churn_pipeline"
version = "0.1.0"
description = "churn_pipeline using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.30,<2.0.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]

[project.scripts]
kickoff = "churn_pipeline.main:kickoff"
run_crew = "churn_pipeline.main:kickoff"
plot = "churn_pipeline.main:plot"
run_with_trigger = "churn_pipeline.main:run_with_trigger"
brief = "churn_pipeline.briefing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "93280e70-e208-4f9b-aa5b-0683d63c1f1d"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
