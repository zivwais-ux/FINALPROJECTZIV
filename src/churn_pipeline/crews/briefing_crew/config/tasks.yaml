write_briefing_task:
  description: >
    Prepare the notes for a retention briefing on customer {customer_id}.

    The decisions are already made: customer_risk_profile returns them as
    plan.decisions (contact, channel, offer and so on), applied in code from
    the retention playbook and the discount policy. The briefing will state
    them exactly as decided. Your job is to explain them.

    1. Call customer_risk_profile with customer_id {customer_id}.
    2. For every entry in the profile's situations, call search_internal_docs
       once with that entry's query, exactly as given.
    3. Call search_recent_news once with the profile's news_query, exactly as
       given.
    4. Return:
       - summary: two sentences (at most 40 words) on who this customer is and what matters most
         for the retention agent, using only facts from the profile.
       - decisions: for every decision in plan.decisions, its id copied
         exactly and one short sentence (at most 20 words) on why it applies to this
         customer, based on what the documents say. Do not restate the
         decision, do not change it and do not add a decision.
       - market: up to three articles from the news search, each with its url
         copied exactly and one sentence on what it may mean for this
         customer's retention (at most 20 words). Leave it empty if the search returned nothing.

    Use only facts from the tools. Do not claim causes of churn and never
    suggest telling the customer their churn score.
  expected_output: >
    BriefingNotes: a two-sentence summary, one explanation per plan decision
    (by id), and up to three market news items (url and relevance).
  agent: retention_briefing_writer
